function showNotice(s,cls='notice'){$('banner').innerHTML=`<div class="${cls}">${esc(s)}</div>`;window.scrollTo({top:0,behavior:'smooth'})}
function banner(){let m=db.meta||{},count=Number(m.changesSinceBackup)||0,last=m.lastBackupDate,days=last?(Date.now()-Date.parse(last))/86400000:Infinity,need=count>5||(count>0&&days>=14);let status=$('backupStatus');if(status){status.classList.toggle('needs-backup',!last||count>0);let when=last&&Number.isFinite(Date.parse(last))?new Date(last).toLocaleString():'Never';status.textContent=(!last?'No verified backup on record':`Last download attempt: ${when}`)+(count?` · ${count} change${count===1?'':'s'} since backup`:' · Verify your downloaded backup');} $('banner').innerHTML=need?`<div class="warn">You have ${count} changes since your last backup. Browser data can be erased. ${button('Download 1-click backup','backup','')}</div>`:''}
const proj=x=>db.projects.find(p=>p.id===x),ord=x=>db.orders.find(o=>o.id===x),statuses=['Draft','Sent','Approved','Invoiced','Paid','Declined','Disputed','Cancelled','Awaiting Approval'];function calc(o){let cost=(o.lines||[]).reduce((s,l)=>s+n(l.qty)*n(l.unit),0),r=n(o.rate)/100,price=o.method==='margin'?cost/(1-r):cost*(1+r),tax=price*n(o.tax)/100;return{cost,price,tax,total:price+tax}}
function paymentEntries(pid,oid){return (db.payments||[]).filter(x=>x.projectId===pid&&(oid===undefined||x.orderId===oid))}
function paidSum(pid,oid){return Math.round(paymentEntries(pid,oid).reduce((a,x)=>a+x.amount,0)*100)/100}
function moneyStatus(total,paid){if(total===null||total===undefined)return paid>0?'Amount unknown':'Not calculated';if(paid>total+0.005)return 'Overpaid / Review';if(total<=0)return paid>0?'Overpaid / Review':'No amount due';if(paid>=total-0.005)return 'Paid in Full';return paid>0?'Partially Paid':'Unpaid'}
function orderPayment(o){let paid=paidSum(o.projectId,o.id),total=calc(o).total;return{paid,total,balance:Math.max(0,total-paid),status:moneyStatus(total,paid)}}
function summary(pid){let list=db.orders.filter(o=>o.projectId===pid),approved=list.filter(o=>['Approved','Invoiced','Paid'].includes(o.status)).reduce((s,o)=>s+calc(o).total,0),pending=list.filter(o=>['Draft','Sent','Awaiting Approval'].includes(o.status)).reduce((s,o)=>s+calc(o).total,0),base=proj(pid)?.contract,received=paidSum(pid),originalPaid=paidSum(pid,null),revised=base===null||base===undefined?null:base+approved;return{base,approved,pending,received,originalPaid,unpaid:Math.max(0,approved-list.reduce((sum,o)=>sum+paidSum(pid,o.id),0)),revised,balance:revised===null?null:Math.max(0,revised-received),paymentStatus:moneyStatus(revised,received)}}
function paymentHistory(pid,oid){let items=paymentEntries(pid,oid).slice().reverse();return items.length?items.map(x=>`<div class="row"><div><strong>${x.amount<0?'Refund: ':''}${money(Math.abs(x.amount))}</strong> · ${esc(x.date)} · ${esc(x.method)}<br><span class="muted tiny">${esc(x.reference||'No reference')}${x.note?' · '+esc(x.note):''}${x.receiptId?' · Combined receipt (linked allocations)':''}</span></div>${button('Correct / Void','voidPayment:'+x.id,'secondary')}</div>`).join(''):'<p class="muted">No payments recorded yet.</p>'}
function paymentBalanceReminder(label,total,received){let known=total!==null&&total!==undefined&&Number.isFinite(Number(total));let remaining=known?Math.max(0,Math.round((Number(total)-received)*100)/100):null;return `<section class="payment-balance-reminder" aria-label="Read-only payment balance reminder"><div class="row"><span>${esc(label)}</span><strong>${known?money(total):'Amount unknown'}</strong></div><div class="row"><span>Already received (net)</span><strong>${money(received)}</strong></div><div class="row payment-due"><span><strong>Remaining balance</strong></span><strong>${known?money(remaining):'Unavailable'}</strong></div><p class="payment-context">For reference only · Calculated from saved payments and refunds · This is not an overdue invoice amount.</p></section>`}
function paymentForm(){let p=proj(selectedProject),o=editing?ord(editing):null;if(!p)return projects();let target=o?`Change order ${o.number} — ${o.title}`:'Original contract';let reminder=paymentBalanceReminder(o?'Change order amount':'Original contract amount',o?calc(o).total:p.contract,paidSum(p.id,o?o.id:null));return `<div class="card"><h1>Record money received</h1><p><strong>${esc(p.name)}</strong> · ${esc(p.client)}</p><div class="notice">Allocation: <strong>${esc(target)}</strong>. Payments are recorded once and included automatically in the overall project totals. This form does not process money or issue a receipt.</div>${reminder}<div class="grid">${field('payAmount','Amount actually received', '', 'number','min="0.01" step="0.01"')}${field('payDate','Date received',date(),'date')}<div class="field"><label for="payMethod">Payment method</label><select id="payMethod">${opt([['Bank transfer','Bank transfer'],['Cash','Cash'],['Check','Check'],['Card','Card'],['Other','Other']],'Bank transfer')}</select></div>${field('payReference','Transaction / receipt reference (optional)')}</div>${area('payNote','Internal payment note (optional)')}<div class="error" id="err-payment"></div><div class="actions">${button('Confirm & save payment','savePayment','')}${button(o?'← Back to Change Order':'← Back to Project',o?'openOrder:'+o.id:'workspace:'+p.id)}</div><p class="hint">For one payment covering multiple items, record separate allocations that sum to the actual receipt. Never enter the same amount twice. A payment recorded here is not proof that the bank cleared it.</p></div>`}
function allocationForm(){let p=proj(selectedProject);if(!p)return projects();let orders=db.orders.filter(o=>o.projectId===p.id&&!o.archived&&['Approved','Invoiced','Paid'].includes(o.status));let projectBalance=summary(p.id);let combinedReminder=paymentBalanceReminder('Approved project total',projectBalance.revised,projectBalance.received);return `<div class="card"><h1>Allocate a combined payment</h1><p><strong>${esc(p.name)}</strong> · ${esc(p.client)}</p><div class="notice">Enter the single amount actually received, then distribute it across the original contract and approved change orders. The allocations must add up exactly to the receipt. This is a record, not a bank transaction.</div>${combinedReminder}<div class="grid">${field('allocTotal','Total amount received','','number','min="0.01" step="0.01"')}${field('allocDate','Date received',date(),'date')}<div class="field"><label for="allocMethod">Method</label><select id="allocMethod">${opt([['Bank transfer','Bank transfer'],['Cash','Cash'],['Check','Check'],['Card','Card'],['Other','Other']],'Bank transfer')}</select></div>${field('allocRef','Receipt / transaction reference (optional)')}</div><h2>Allocate this receipt</h2><div class="field"><label for="allocOriginal">Original contract · ${p.contract===null?'contract amount unknown':money(p.contract)} · paid ${money(paidSum(p.id,null))}</label><input id="allocOriginal" type="number" min="0" step="0.01" value="0"></div>${orders.map(o=>`<div class="field"><label for="allocation-${esc(o.id)}">${esc(o.number)} · ${esc(o.title)} · balance ${money(Math.max(0,calc(o).total-paidSum(p.id,o.id)))}</label><input class="allocation-part" id="allocation-${esc(o.id)}" data-oid="${esc(o.id)}" type="number" min="0" step="0.01" value="0"></div>`).join('')}<div class="error" id="err-allocation"></div><div class="actions">${button('Save allocated payment','saveAllocation','')}${button('Cancel','workspace:'+p.id)}</div></div>`}
function refundForm(){let p=proj(selectedProject),o=editing?ord(editing):null;if(!p)return projects();return `<div class="card"><h1>Record a refund actually issued</h1><p><strong>${esc(p.name)}</strong> · ${o?esc(o.number+' — '+o.title):'Original contract'}</p><div class="warn">Only record money that was actually returned to the customer. A refund reduces net payments received. It does not cancel an approved charge or change the contract price.</div><div class="grid">${field('refundAmount','Amount refunded','','number','min="0.01" step="0.01"')}${field('refundDate','Date refunded',date(),'date')}<div class="field"><label for="refundMethod">Refund method</label><select id="refundMethod">${opt([['Bank transfer','Bank transfer'],['Cash','Cash'],['Check','Check'],['Card','Card'],['Other','Other']],'Bank transfer')}</select></div>${field('refundRef','Reference (optional)')}</div>${area('refundReason','Reason for refund (required)')}<div class="error" id="err-refund"></div><div class="actions">${button('Record issued refund','saveRefund','')}${button(o?'← Back to Change Order':'← Back to Project',o?'openOrder:'+o.id:'workspace:'+p.id)}</div></div>`}
function closeoutForm(){let p=proj(selectedProject);if(!p)return projects();let sm=summary(p.id),issues=[];if(p.contract===null||!p.scope?.trim())issues.push('Original project details incomplete');if(db.orders.some(o=>o.projectId===p.id&&['Draft','Sent','Awaiting Approval','Disputed'].includes(o.status)&&!o.archived))issues.push('Unresolved change orders or approval disputes');if(sm.balance===null)issues.push('Remaining contract balance unknown');else if(sm.balance>0.005)issues.push('Remaining contract balance: '+money(sm.balance));let pending=db.orders.filter(o=>o.projectId===p.id&&!o.archived&&o.workStatus==='Completed'&&o.invoiceStatus!=='Invoiced');if(pending.length)issues.push(pending.length+' completed change order(s) not marked invoiced');return `<div class="card"><h1>${p.closeout?.closedAt?'Reopen project':'Project closeout review'}</h1><p>${esc(p.name)} · ${esc(p.client)}</p><div class="${issues.length?'warn':'good'}"><strong>${issues.length?'Items to review':'No automated issues found'}</strong>${issues.length?'<ul>'+issues.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>Review actual invoices, customer communications and bank records before closing.</p>'}</div>${area('closeNote','Closeout note / unresolved exceptions',p.closeout?.note||'')}<div class="actions">${button(p.closeout?.closedAt?'Reopen project':'Confirm closeout','saveCloseout','')}${button('Cancel','workspace:'+p.id)}</div><p class="hint">Closing is an organizational label, not proof of full payment, completed work, or customer acceptance. Records remain available.</p></div>`}

function orders(){return `<div class="card"><div class="row"><h1>Change orders</h1>${changeOrderButton()}</div>${db.projects.length?'<p class="hint">Select the correct existing project or create a new one before recording extra work.</p>':'<p class="inline-help">Use Add Change Order to create a quick project record first.</p>'}<label for="orderSearch">Search change orders</label><input id="orderSearch" placeholder="Number, scope, project, customer" value="${esc(search)}">${pills('orders')}<div class="field"><label for="orderProjectFilter">Project</label><select id="orderProjectFilter"><option value="">All projects</option>${opt(db.projects.map(p=>[p.id,p.name]),selectedProject)}</select></div><div id="orderResults">${orderRows(orderFiltered())}</div></div>`}
function lineHTML(l,i){return `<div class="line" data-line="${i}"><div class="desc"><label>Item description</label><input data-k="desc" value="${esc(l.desc)}" placeholder="e.g., Labor (hours)"></div><div><label>Quantity</label><input type="number" min="0" step="any" data-k="qty" value="${esc(l.qty)}" placeholder="e.g., 4"></div><div><label>Unit cost</label><input type="number" min="0" step="any" data-k="unit" value="${esc(l.unit)}" placeholder="e.g., 75.00"></div><div><label>Line subtotal</label><strong class="lineSubtotal">${money(n(l.qty)*n(l.unit))}</strong></div><button class="danger" data-action="removeLine:${i}" aria-label="Remove line ${i+1}">×</button></div>`}
function chooseProject(){return `<div class="card"><h1>Add Change Order · Choose Project</h1><p>Every change order must belong to the correct project. Never attach it to an unrelated job.</p><div class="grid"><div class="field"><label for="chooseExisting">Existing project</label><select id="chooseExisting"><option value="">Select a project…</option>${opt(db.projects.map(p=>[p.id,p.name+' — '+p.client]),'')}</select></div></div><div class="actions">${button('Continue with selected project','useProject','')}${button('Create new project (quick setup)','quickProject','secondary')}${button('Cancel','orders')}</div><p class="hint">Quick setup requires a customer and project name. Original scope and contract amount can be entered later; unknown amounts are never treated as $0.</p></div>`}
function orderForm(){let o=editing?ord(editing):null;return `<div class="card"><h1>${o?'Edit change order':'New change order'}</h1>${o&&o.status!=='Draft'?'<div class="warn">This order has already been sent or processed. Saving financial or scope changes will archive the previous version and create a numbered revision. Approval will need to be reconfirmed.</div>':''}<div class="ux-section"><h2>1. Describe the extra work</h2><p class="ux-note">Choose the correct job and explain exactly what changed.</p></div><div class="grid"><div class="field"><label for="oproject">Project</label><select id="oproject"><option value="">Choose the correct project…</option>${opt(db.projects.map(p=>[p.id,p.name+' — '+p.client]),o?.projectId||selectedProject||'')}</select><div class="error" id="err-oproject"></div><p class="hint">Wrong project? Cancel and choose or create the correct one.</p></div>${field('onumber','Change order number',o?.number||'CO-'+String(db.orders.length+1).padStart(3,'0'))}${field('otitle','Short title',o?.title)}${field('odate','Date',o?.date||date(),'date')}</div>${area('oscope','Additional work scope',o?.scope)}<p class="hint">Describe exactly what is added, removed, or changed compared with the original agreement.</p><datalist id="reasonSuggestions"><option value="Additional Work Requested"><option value="Last-Minute Customer Change"><option value="Change to Original Scope"><option value="Unforeseen Site Conditions"><option value="Material or Equipment Change"><option value="Other"></datalist>${area('oreason','Reason for change (describe the specific circumstances)',o?.reason)}<div class="ux-section"><h2>2. Price the change</h2><p class="ux-note">Enter costs and confirm the selling price before requesting approval.</p></div><h2>Cost items</h2><div id="lines">${lines.map(lineHTML).join('')}</div><div class="error" id="err-lines"></div><div class="actions">${button('Add Line Item','addLine')}</div><div class="grid"><div class="field"><label for="omethod">Pricing method</label><select id="omethod">${opt([['markup','Add a percentage to my costs (Markup)'],['margin','Set my target profit margin']],o?.method||'markup')}</select></div><p class="hint">Example with $500 costs: 20% markup = $600 price ($100 gross profit); 20% margin = $625 price ($125 gross profit). Gross profit excludes any overhead not entered as costs.</p>${field('orate','Pricing percentage',o?.rate??20,'number','min="0" step="0.01"')}${field('otax','Sales tax % (where applicable)',o?.tax??db.business.tax,'number','min="0" max="100" step="0.01"')}${field('odays','Added project days',o?.extraDays??0,'number','min="0" step="1"')}</div><div class="error" id="err-pricing"></div><div class="summary" id="liveTotal"></div><div class="ux-section"><h2>3. Review and save</h2><p class="ux-note">Confirm terms and schedule impact. Saving creates a draft; it does not send or approve the change order.</p></div>${area('oterms','Payment terms',o?.terms||'')}${area('oschedule','Schedule impact / exclusions',o?.schedule)}<div class="actions">${button(o?'Save changes':'Save draft','saveOrder','')}${button('Cancel',o?'openOrder:'+o.id:'orders')}</div></div>`}
function syncLines(){lines=[...document.querySelectorAll('[data-line]')].map(el=>({desc:el.querySelector('[data-k="desc"]').value.trim(),qty:el.querySelector('[data-k="qty"]').value,unit:el.querySelector('[data-k="unit"]').value}))}
function liveTotal(){if(tab!=='orderForm')return;syncLines();let r=n(val('orate')),t=n(val('otax')),method=val('omethod');let err='';if(!Number.isFinite(r)||r<0)err='Enter a valid nonnegative rate.';else if(method==='margin'&&r>=100)err='Margin must be under 100% (try Markup instead).';else if(!Number.isFinite(t)||t<0||t>100)err='Tax must be between 0% and 100%.';$('err-pricing').textContent=err;let cost=lines.reduce((s,l)=>s+(n(l.qty)||0)*(n(l.unit)||0),0),price=method==='margin'&&r>=100?null:method==='margin'?cost/(1-r/100):cost*(1+r/100);$('liveTotal').innerHTML=`<strong>Cost: ${money(cost)}</strong> · ${price===null?'Fix margin to see total':`Price before tax: ${money(price)} · Estimated gross profit: <strong>${money(price-cost)}</strong> · Total: <strong>${money(price*(1+t/100))}</strong>`}`}
function readiness(o){let missing=[];if(!o.scope?.trim())missing.push('Work scope');if(!o.lines?.length||o.lines.some(l=>!l.desc))missing.push('Itemized pricing');if(!o.terms?.trim())missing.push('Payment terms');if(!proj(o.projectId)?.client)missing.push('Customer details');if(!o.schedule?.trim()&&!o.extraDays)missing.push('Schedule impact (state “None” if no change)');return missing}
function detail(){let o=ord(editing);if(!o)return orders();let p=proj(o.projectId),t=calc(o),missing=readiness(o);return `<div class="card"><div class="notice"><strong>Work:</strong> ${esc(o.workStatus||"Not started / unrecorded")} · <strong>Invoice:</strong> ${esc(o.invoiceStatus||"Not invoiced")} · <strong>Payment:</strong> ${esc(orderPayment(o).status)}<div class="actions">${button("Update work / invoice", "workInvoice:"+o.id)}</div></div><div class="row"><div><h1>${esc(o.number)} · ${esc(o.title)}</h1><p class="muted">${esc(p?.name||'Missing project')} · ${esc(o.date)} · <span class="badge">${esc(o.status)}</span></p></div><div class="actions">${button('← Project','workspace:'+o.projectId)}${button('Print / Save PDF','print:'+o.id,'')}${button('Email / Text summary','send:'+o.id,'')}<details class="ux-disclosure"><summary>Edit & record options</summary><div class="actions">${button('Edit / revise','editOrder:'+o.id)}${button('Duplicate','duplicate:'+o.id)}${button(['Draft','Sent','Awaiting Approval'].includes(o.status)&&!o.approval?'Delete':'Archive','deleteOrder:'+o.id,'danger')}</div></details></div></div>${missing.length?`<div class="warn"><strong>Readiness check:</strong> Before sending, review: ${esc(missing.join(', '))}.</div>`:'<div class="good">Readiness check passed: essential fields are present. Confirm accuracy before sending.</div>'}<h2>Additional work</h2><p>${esc(o.scope)}</p><p class="muted">${esc(o.reason||'')}</p><div class="stack">${o.lines.map(l=>`<div class="row"><span>${esc(l.desc)} (${esc(l.qty)} × ${money(n(l.unit))})</span><strong>${money(n(l.qty)*n(l.unit))}</strong></div>`).join('')}</div><div class="summary"><div class="row"><span>Cost</span><strong>${money(t.cost)}</strong></div><div class="row"><span>${o.method==='margin'?'Target margin':'Markup'} ${esc(o.rate)}%</span><strong>${money(t.price)}</strong></div><div class="row"><span>Tax (${esc(o.tax)}%)</span><strong>${money(t.tax)}</strong></div><div class="row"><strong>Change order total</strong><strong class="stat">${money(t.total)}</strong></div></div><p><strong>Added days:</strong> ${esc(o.extraDays)} · <strong>Schedule:</strong> ${esc(o.schedule||'Not specified')}</p><p><strong>Payment terms:</strong> ${esc(o.terms||'Not specified')}</p><h2>Payment tracking</h2><div class="summary"><div class="row"><span>Change order amount</span><strong>${money(t.total)}</strong></div><div class="row"><span>Payments received</span><strong>${money(orderPayment(o).paid)}</strong></div><div class="row"><span>Remaining balance</span><strong>${money(orderPayment(o).balance)}</strong></div><div class="row"><span>Payment status</span><strong>${esc(orderPayment(o).status)}</strong></div></div><div class="actions">${button('Record Change Order Payment','payOrder:'+o.id,'')}${button('Record refund','refundOrder:'+o.id)}${button('View payment history','togglePaymentHistory')}</div><div id="orderPaymentHistory" class="hidden"><h3>Change order payment history</h3>${paymentHistory(o.projectId,o.id)}</div>${o.status==='Paid'&&!orderPayment(o).paid?'<div class="warn">Legacy Paid status found. No actual payment is recorded in the new ledger. Verify the receipt and enter it once if appropriate.</div>':''}<p class="hint">Payment records are independent of approval, work progress and invoice status. Payment entries do not automatically approve work.</p><h2>Approval & tracking</h2><div class="actions">${approvalValid(o)?'<p class="good">Approval is locked to this version. To change scope, price or schedule, use Edit to create a new revision.</p>':button('Record Customer Approval','external:'+o.id,'')+button('In-person signature','signature:'+o.id)}${button('Log status','status:'+o.id)}</div>${o.approval?`<div class="${o.status==='Disputed'?'critical':'good'}">${o.status==='Disputed'?'Approval disputed — do not treat as undisputed authorization. ':''}Approval recorded: ${esc(o.approval.method)} · ${esc(o.approval.signer||'Customer')} · ${esc(o.approval.date)}<br>${esc(o.approval.note||'')}${o.approval.evidence?`<br><strong>Proof attached:</strong> ${esc(o.approval.evidence.name)} ${button('View Proof','viewProof:'+o.id)}`:''}<br><small>This is a manually recorded event, not independently verified.</small></div>`:'<div class="warn">No customer approval is recorded. Work performed without documented approval may be difficult to collect.</div>'}${o.invalidatedApprovals?.length?`<h3>Invalidated approvals (retained)</h3>${o.invalidatedApprovals.map(a=>`<p class="tiny">${esc(a.invalidatedAt)} — ${esc(a.signer)} — ${esc(a.reason)}</p>`).join('')}`:''}${o.statusHistory?.length?`<h3>Status history</h3>${o.statusHistory.map(h=>`<p class="tiny">${esc(h.date)} — ${esc(h.status)} — ${esc(h.note||'')}</p>`).join('')}`:''}${o.sentLog?.length?`<h3>Send activity (manual)</h3>${o.sentLog.map(s=>`<p class="tiny">${esc(s.date)} — ${esc(s.method)} — ${esc(s.note)}</p>`).join('')}`:''}${o.revisions?.length?`<h2>Archived revisions</h2>${o.revisions.map(r=>`<div class="row"><div><strong>${esc(r.number)}</strong> · ${esc(r.savedAt)} · ${esc(r.status)}<br><span class="muted tiny">Archived total: ${money(calc(r).total)}</span></div>${button('Print archived copy','printRevision:'+o.id+':'+r.number)}</div>`).join('')}`:''}</div>`}
function workInvoiceForm(){let o=ord(editing);if(!o)return orders();return `<div class="card"><h1>Work and invoice tracking</h1><p>${esc(o.number)} · ${esc(o.title)}</p><p class="hint">These are manual records. Marking Invoiced does not create or send an invoice. Marking Completed does not confirm customer acceptance.</p><div class="field"><label for="workState">Work status</label><select id="workState">${opt([['Not started','Not started'],['In progress','In progress'],['Completed','Completed']],o.workStatus||'Not started')}</select></div><div class="field"><label for="invoiceState">Invoice status</label><select id="invoiceState">${opt([['Not invoiced','Not invoiced'],['Invoiced','Invoiced']],o.invoiceStatus||'Not invoiced')}</select></div>${field('invoiceRef','Invoice number / reference',o.invoiceRef||'')}${field('invoiceDate','Invoice date',o.invoiceDate||'','date')}${area('workNote','Record note (optional)')}<div class="error" id="err-workInvoice"></div><div class="actions">${button('Save work and invoice status','saveWorkInvoice','')}${button('Cancel','openOrder:'+o.id)}</div></div>`}
function externalForm(){let o=ord(editing);return `<div class="card"><h1>Record Customer Approval</h1><p class="warn">Only log approval you actually received and retained. This app cannot verify email, text, or identity.</p><div class="grid"><div class="field"><label for="amethod">Approval method</label><select id="amethod">${opt([['Email','Email'],['Text message','SMS / text'],['WhatsApp','WhatsApp'],['Signed document','Signed document'],['Verbal','Verbal — written confirmation needed'],['Other','Other']],'Email')}</select></div>${field('adate','Date approved',date(),'date')}${field('aname','Approving customer name',proj(o.projectId)?.client||'')}</div>${area('anote','Confirmation note / location of evidence','')}<div class="field"><label for="aproof">Attach approval evidence (optional — JPG, PNG or PDF)</label><input type="file" id="aproof" accept="image/png,image/jpeg,application/pdf"><p class="hint">Maximum 1.5 MB. Stored inside the offline record and JSON backup. Keep the original message/email too.</p><div class="error" id="err-aproof"></div></div><div class="actions">${button('Record approval','saveExternal','')}${button('Cancel','openOrder:'+o.id)}</div></div>`}
function signatureForm(){let previous=ord(editing)?.approval;return `<div class="card"><h1>In-person signature</h1><p class="warn">Have the customer review the complete change order before signing. A signature is not a guarantee of payment or enforceability.</p>${field('sname','Signer name',previous?.signer||proj(ord(editing).projectId)?.client||'')}${field('sdate','Date signed',previous?.date||date(),'date')}<label for="sig">Signature ${previous?.signature?'(saved — visible below)':''}</label><canvas id="sig" width="900" height="300" aria-label="Draw signature here"></canvas><div class="error" id="err-sig"></div><div class="actions">${button('Undo stroke','undoStroke')}${button('Clear','clearStroke')}${button('Save approval','saveSignature','')}${button('Cancel','openOrder:'+editing)}</div></div>`}
function statusForm(){let o=ord(editing);return `<div class="card"><h1>Update status · ${esc(o.number)}</h1><p class="muted">Use approval logging to mark an order Approved. Status changes are manual and do not send invoices or collect payments.</p><div class="field"><label for="newstatus">New status</label><select id="newstatus">${opt(statuses.filter(s=>s!=='Paid').map(s=>[s,s]),o.status)}</select><div class="error" id="err-newstatus"></div></div>${area('statusnote','Reason / evidence reference (required for dispute, cancellation or correction)','')}<div class="actions">${button('Save status','saveStatus','')}${button('Cancel','openOrder:'+o.id)}</div></div>`}
function sendForm(){let o=ord(editing),p=proj(o.projectId),t=calc(o),summary=`Change Order ${o.number} — ${o.title}\nProject: ${p?.name||''}\nCustomer: ${p?.client||''}\nAdditional scope: ${o.scope}\nItems:\n${o.lines.map(l=>`- ${l.desc}: ${l.qty} × ${money(n(l.unit))} = ${money(n(l.qty)*n(l.unit))}`).join('\n')}\nPrice before tax: ${money(t.price)}\nTax: ${money(t.tax)}\nTOTAL: ${money(t.total)}\nAdded days: ${o.extraDays}\nSchedule: ${o.schedule||'Not specified'}\nTerms: ${o.terms||'Not specified'}\nPlease review and confirm approval in writing before work begins. This message does not constitute automatic approval.`;window._sendText=summary;return `<div class="card"><h1>Send to client</h1><p class="notice">Copy this message into your preferred messaging or email app. Mark as Sent only after you actually send it; sending does not mean approved.</p><label for="sendText">Itemized message</label><textarea id="sendText" style="min-height:250px">${esc(summary)}</textarea><div class="error" id="err-sendText"></div><div class="actions">${button('Copy Message','copy','')}${button('Mark as Sent','markSent','')}${button('Back','openOrder:'+o.id)}</div><p class="muted tiny">Opening email or copying a message does not change the status. Mark Sent only after actually sending it.</p></div>`}
function settings(){let b=db.business;return `<div class="card"><h1>Business settings</h1><div class="grid">${field('bname','Business name',b.name)}${field('bowner','Owner / contact person (optional)',b.owner||'')}${field('bemail','Business email',b.email,'email')}${field('bphone','Business phone',b.phone)}${field('baddress','Business address',b.address)}<div class="field"><label for="bcurrency">Currency</label><select id="bcurrency">${opt(['USD','EUR','GBP','CAD','AUD'].map(x=>[x,x]),b.currency)}</select></div>${field('btax','Default sales tax %',b.tax,'number','min="0" max="100" step="0.01"')}</div>${button('Save settings','saveSettings','')}<h2>Backups & device transfer</h2><p><strong>Your records stay in this browser on this device.</strong> They do not automatically sync to your laptop or another phone. Clearing browser data may erase them. Save a backup after meaningful changes.</p><details class="ux-disclosure"><summary>How to move records to another device</summary><p>1. Save a JSON backup on your current device and verify it exists. 2. Transfer that file to the other device. 3. Open ExtraWork Guard there and choose Restore Backup. 4. If you later edit records there, transfer a new backup back before using the first device again.</p><p class="warn"><strong>Restore replaces records; it does not merge.</strong> Check which device has the latest information before restoring.</p></details><div class="actions">${button('Save JSON backup','backup','')}${button('Restore JSON backup','import')}</div><p class="muted tiny">Mobile tip: Select a backup document from Files, Downloads, Google Drive, or Dropbox. If Android labels a Dropbox JSON backup as BIN, you may still be able to select it. ExtraWork Guard checks the file contents and backup structure before restoring. If your file manager still blocks it, save the backup to Downloads first.</p><p class="muted tiny">Last download attempt: ${esc(db.meta.lastBackupDate||'Never')} · Changes since attempt: ${db.meta.changesSinceBackup}</p>${button('Load sample project','sample')}</div>`}
function help(){return `${browserReminder()}<div class="card"><h1>Quick start</h1><p><strong>1.</strong> Set up your business under Business & backups. <strong>2.</strong> Create a project with its original contract value. <strong>3.</strong> Open the project and add a change order. <strong>4.</strong> Enter scope, cost items, pricing, terms, and schedule impact. <strong>5.</strong> Save the draft and review its readiness check. <strong>6.</strong> Print to PDF or prepare an email/text summary. <strong>7.</strong> Log actual customer approval and track invoicing/payment. <strong>8.</strong> Export backups regularly.</p><h2>V4.1 payments and closeout</h2><p>Allocate one combined receipt across the original contract and approved changes; record actual refunds separately as negative entries. Track work and invoice states independently of customer approval and payment. Review unresolved issues before project closeout. None of these actions sends invoices, transfers money, or proves legal completion.</p><h2>Payment records</h2><p>Record money actually received in each Project Workspace (original contract) or Change Order (extra work). Partial payments and remaining balances are calculated automatically. A legacy Paid status does not prove a payment was received. For a combined customer payment, split the allocation between original contract and change orders without duplicating the amount. Keep external receipts and bank records. Payment records are not invoices and do not move funds.</p><h2>Important distinctions</h2><p>Markup increases cost by a percentage; target margin calculates price so profit is the chosen percentage of selling price. Pending changes are <strong>not</strong> included in the revised contract value. A recorded approval or signature is not independently authenticated. Printing, messaging, invoicing, and payment collection are not integrated services.</p><h2>Offline and mobile</h2><p>This single HTML file runs locally without a server once downloaded. Browser storage, file downloads, printing, and mail apps vary by device; test them before using on a jobsite. Keep backups outside the browser.</p></div>`}
function welcome(){return `${browserReminder()}<div class="card onboard"><h1>Welcome to ExtraWork Guard</h1><p>Let's get your business ready before you create your first project. This information will appear on your change-order documents.</p><div class="steps"><section class="step"><div class="stepno">STEP 1</div><h2>Business details</h2><p>Set your business name, contact person, currency and default tax.</p></section><section class="step"><div class="stepno">STEP 2</div><h2>Your first project</h2><p>Record the original agreed contract before documenting extra work.</p></section></div><div class="actions">${button('Set up my business','startSetup','')}${button('Explore first','skipSetup')}</div><p class="hint">Your data stays in this browser. Download backups regularly once you start recording jobs.</p></div>`}
function setupFinish(){return `<div class="card onboard"><h1>You're ready to track extra work</h1><p><strong>Step 3 — How change orders work:</strong> Open the original project whenever the customer requests work outside the agreed scope. Create a change order under that project, document the cost and scope, then record customer approval before proceeding.</p><div class="good">Your first project has been saved. We recommend downloading a backup now, and after significant changes.</div><div class="actions">${button('Open my project','finishSetup','')}${button('Download backup','backup','secondary')}</div></div>`}
function render(){let chip=$('browserChip');if(chip)chip.textContent='Current browser: '+currentBrowser();document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('app').innerHTML=({welcome,setupFinish,dashboard,projects,workspace,projectForm,orders,chooseProject,orderForm,detail,externalForm,signatureForm,statusForm,sendForm,paymentForm,allocationForm,refundForm,closeoutForm,workInvoiceForm,settings,help}[tab]||dashboard)();banner();if(tab==='orderForm')liveTotal();if(tab==='signatureForm')setupSig()}
function err(key,msg){let x=$('err-'+key),el=$(key);if(x)x.textContent=msg;if(el)el.classList.add('invalid');return false}function clearErrors(){document.querySelectorAll('.error').forEach(x=>x.textContent='');document.querySelectorAll('.invalid').forEach(x=>x.classList.remove('invalid'))}function fail(){let x=document.querySelector('.invalid,.error:not(:empty)');x?.scrollIntoView({behavior:'smooth',block:'center'});x?.focus?.()}
function setupSig(){window._sigCleared=false;strokes=[];draftSig=[];let c=$('sig'),ctx=c.getContext('2d'),active=false,current=null,existing=ord(editing)?.approval?.signature||null,baseImage=null;if(existing){baseImage=new Image();baseImage.onload=()=>draw();baseImage.src=existing;}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function draw(){ctx.clearRect(0,0,c.width,c.height);if(!window._sigCleared&&baseImage?.complete&&baseImage.naturalWidth)ctx.drawImage(baseImage,0,0,c.width,c.height);ctx.strokeStyle='#173b57';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';for(let stroke of strokes){if(!stroke.length)continue;ctx.beginPath();ctx.moveTo(stroke[0].x,stroke[0].y);if(stroke.length===1){ctx.lineTo(stroke[0].x+.1,stroke[0].y+.1)}else{for(let i=1;i<stroke.length-1;i++){let mid={x:(stroke[i].x+stroke[i+1].x)/2,y:(stroke[i].y+stroke[i+1].y)/2};ctx.quadraticCurveTo(stroke[i].x,stroke[i].y,mid.x,mid.y)}let end=stroke[stroke.length-1];ctx.lineTo(end.x,end.y)}ctx.stroke()}}window._drawSig=draw;c.onpointerdown=e=>{active=true;current=[point(e)];strokes.push(current);c.setPointerCapture(e.pointerId);draw()};c.onpointermove=e=>{if(active){current.push(point(e));draw()}};c.onpointerup=c.onpointercancel=()=>{active=false;current=null}}
